name: Release

# On a version tag, build Plaza from that commit, package a single ad-hoc signed
# (not notarized) macOS .app, and publish it as a GitHub release. The artifact is
# reproducible: it is built here from the tagged source, and anyone can rebuild
# it with scripts/package-macos.sh (see the README).
on:
  push:
    tags: ["v*"]
  # How the Tag workflow asks for a build: a tag it pushed with the default
  # token cannot start this one on its own. Run against the tag ref, so
  # `github.ref_name` is the tag exactly as a tag push would give it.
  workflow_dispatch:

permissions:
  contents: write # create the release and upload the .app

env:
  # The Notary release this Plaza ships. Plaza carries Notary's daemon and its
  # window rather than a signer of its own, so the keyholder has one
  # implementation, built and audited once.
  #
  # A TAG, not a branch. A release is the one artifact nobody gets to re-check,
  # and "whatever notary's main happened to be that afternoon" is not something
  # anybody could reproduce later. Bump it deliberately, with the Plaza release
  # that needs it.
  NOTARY_REF: v0.10.7

jobs:
  macos-app:
    name: package · ad-hoc sign · publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Zig version
        id: zig-version
        run: echo "version=$(cat .zigversion)" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig-version.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Native SDK CLI
        run: npm install -g @native-sdk/cli@0.9.2

      # The tests run on every pull request, but a tag can be pushed at any
      # commit, and a release is the one artifact nobody gets to re-check. So the
      # suite runs again here and the release does not exist if it fails. Both
      # halves, because the bundle carries more than one binary.
      - name: Test
        run: native test

      # Plaza ships NOTARY's daemon and window rather than a signer of its own,
      # so the keyholder has one implementation instead of two. Pinned to a tag
      # rather than tracking a branch: a release is the one artifact nobody gets
      # to re-check, and "whatever notary's main happened to be" is not a thing
      # anybody could reproduce later.
      - name: Check out Notary
        uses: actions/checkout@v4
        with:
          repository: zig-nostr/notary
          ref: ${{ env.NOTARY_REF }}
          path: .notary

      # The script clears both zig-outs, refuses to package a plaza carrying the
      # automation server, injects Notary's two binaries and signs inside-out.
      # See its comments: a bare `native package` signs whatever is already in
      # zig-out/bin and carries no second binary.
      - name: Package the app (ad-hoc signed)
        run: scripts/package-macos.sh --notary .notary

      - name: Zip the .app (ditto preserves the signature)
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Plaza.app" "Plaza-${{ github.ref_name }}-macos.zip"

      # The tag and the manifest have to agree, and this is the last place that
      # can be checked. `app.zon` is where the app reads its own version from, so
      # tagging v0.5.0 on a tree that still says 0.4.1 ships a build that tells
      # people in Settings that they are running the previous release. That has
      # happened here before, from the other direction: the version was typed
      # twice and Settings was two releases stale until build.zig started reading
      # the manifest instead.
      - name: The tag and app.zon must agree
        run: |
          manifest="$(sed -n 's/.*\.version = "\([^"]*\)".*/\1/p' app.zon | head -1)"
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tagged" ]; then
            echo "tag $GITHUB_REF_NAME says $tagged, app.zon says $manifest" >&2
            exit 1
          fi
          echo "both say $manifest"

      # `create` for a new tag, `upload --clobber` for one that already has a
      # release. Re-running this job is otherwise a red X on work that succeeded,
      # and the re-run is exactly what somebody reaches for when a publish failed
      # halfway.
      #
      # This does not weaken the rule above it. Both suites gate this step, so
      # nothing arrives here that has not passed them on the tag's own source. A
      # release created by hand, which is the other way to reach this branch, has
      # its artifact REPLACED by the one built here, which is the right way round:
      # the tested artifact wins.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="Plaza-${GITHUB_REF_NAME}-macos.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release exists; replacing its artifact with the one built here"
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          else
            # A DRAFT. The Linux tarballs are built by another job that takes
            # minutes longer, and a release published before they arrive offers
            # a Linux install that 404s for exactly that long. v0.18.0 was live
            # with macOS only for eight minutes, which somebody noticed. The
            # `publish` job below lifts the draft once every artifact is up.
            gh release create "$GITHUB_REF_NAME" "$asset" \
              --draft \
              --title "Plaza $GITHUB_REF_NAME" \
              --notes-file .github/RELEASE_NOTES.md
          fi

  # The Linux tarballs, which the release has never carried. `install-linux.sh`
  # has been fetching `plaza-<version>-linux-<arch>.tar.gz` and its `.sha256`
  # from the latest release since it was written, and no release has ever had
  # either, so the documented one-line install could only ever have 404ed. The
  # recipe is not new: it is the `linux-package` job from ci.yml, which has been
  # building these on every pull request and uploading them to workflow
  # artifacts where nobody could install them from.
  #
  # `needs: macos-app` so the release exists before this uploads into it, and so
  # a Linux artifact is never published beside a macOS build that failed. That
  # job also owns the tag-versus-app.zon check, so nothing here can ship under a
  # tag whose name and contents disagree.
  linux-tarball:
    name: package · publish (${{ matrix.arch }})
    needs: macos-app
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    steps:
      - uses: actions/checkout@v4

      - name: Read Zig version
        id: zig-version
        run: echo "version=$(cat .zigversion)" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig-version.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Native SDK CLI
        run: npm install -g @native-sdk/cli@0.9.2

      # gtk4 only, for the same reason ci.yml gives: Plaza declares no web use,
      # so installing WebKit here would hide a regression that made it real.
      - name: Install the Linux host dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev

      - name: Check out Notary
        uses: actions/checkout@v4
        with:
          repository: zig-nostr/notary
          ref: ${{ env.NOTARY_REF }}
          path: .notary

      # Packaging itself is not retried: with the cache warm it needs no
      # network, and a failure here is a real one worth seeing.
      - name: Package
        run: scripts/package-linux.sh --notary .notary

      # The installer derives the file name from the release tag and `uname -m`,
      # so a tarball named for the wrong architecture is a 404 for whoever the
      # runner was not. Checked here rather than trusted.
      - name: The tarball matches the tag and this architecture
        run: |
          want="plaza-${GITHUB_REF_NAME#v}-linux-${{ matrix.arch }}.tar.gz"
          [ -f "dist/$want" ] || { echo "expected dist/$want, got: $(ls dist)" >&2; exit 1; }
          [ -f "dist/$want.sha256" ] || { echo "no published digest beside $want" >&2; exit 1; }
          echo "$want"

      # Always `--clobber`: macos-app created the release, and a re-run of a
      # half-finished publish is exactly what somebody reaches for.
      - name: Publish the tarball and its digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          want="plaza-${GITHUB_REF_NAME#v}-linux-${{ matrix.arch }}.tar.gz"
          gh release upload "$GITHUB_REF_NAME" "dist/$want" "dist/$want.sha256" --clobber

  # Lifts the draft, once and only once every artifact is up. Until this runs
  # the release is invisible, so there is no window in which the page offers a
  # download that is not there yet.
  publish:
    needs: [macos-app, linux-tarball]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false
          echo "published $GITHUB_REF_NAME with:"
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'
