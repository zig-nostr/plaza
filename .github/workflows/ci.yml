name: CI

on:
  push:
    # `main`, and the branches the Notary-bump job pushes. A pull request opened
    # with the default token does not start a workflow, so its checks would
    # never run and branch protection would never be satisfiable. Checks attach
    # to a COMMIT, so running them on the push covers the pull request that
    # carries the same commit.
    branches: [main, "notary-bump/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The full check on the platform Plaza ships from today.
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Zig version
        id: zig-version
        run: echo "version=$(cat .zigversion)" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig-version.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Native SDK CLI
        run: npm install -g @native-sdk/cli@0.10.1

      - name: Check markup and manifest
        run: native check

      - name: Test
        run: native test

      # The keyholder is a separate binary with its own step, so `native test`
      # and `zig build test` both walk straight past it. Its 21 tests had never
      # run on any machine but mine, including the ones guarding the migration
      # that can delete somebody's only copy of their key.

      - name: Build
        run: native build

      - name: Check formatting
        run: zig fmt --check src


  # Linux builds the whole stack (the library with its vendored secp256k1 and
  # LMDB, the stb codecs, and the app) and runs the test suite, so a portability
  # break surfaces on the pull request that causes it rather than months later.
  # A packaged Linux release comes later: the toolkit renders through a software
  # rasteriser off macOS today, so shipping one now would misrepresent how Plaza
  # performs.
  #
  # Windows is not in the matrix yet: the relay transport resolves hostnames
  # through libc `getaddrinfo`, which Zig's standard library does not declare
  # for Windows, so nothing depending on the library links there. That is a gap
  # in the protocol library rather than in Plaza, filed as zig-nostr/nostr#59
  # (found by this job on its first run), and Windows joins the matrix as soon
  # as it lands.
  # A release page's text is a hand-written file, and Notary shipped a release
  # describing the PREVIOUS one: the release commit bumped the versions and the
  # changelog and forgot this file, and nothing anywhere noticed. Whoever reads
  # that page is told about a release that is not the one they are downloading.
  #
  # Plaza publishes the same way and had the same hole. One grep on every push.
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The release notes name the version being released
        run: |
          version="$(sed -n 's/^ *\.version = "\(.*\)",$/\1/p' app.zon | head -1)"
          [ -n "$version" ] || { echo "could not read the version from app.zon"; exit 1; }
          if ! grep -qF "What's new in v$version" .github/RELEASE_NOTES.md; then
            echo "app.zon says $version, but .github/RELEASE_NOTES.md does not say"
            echo "\"What's new in v$version\". The release page takes its text from that"
            echo "file, so publishing now would describe a different release."
            echo
            echo "It currently says:"
            grep -n "What's new in" .github/RELEASE_NOTES.md || echo "  (nothing)"
            exit 1
          fi
          echo "release notes are for v$version"
  portability:
    name: portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Read Zig version
        id: zig-version
        shell: bash
        run: echo "version=$(cat .zigversion)" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig-version.outputs.version }}

      # The Linux host binds GTK4 and WebKitGTK; without the dev packages the
      # link fails on the host layer rather than on anything of ours.
      - name: Install Linux host dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # gtk4 only. The WebKit layer is compiled out (Plaza draws on a
          # canvas, not in a browser) and the release job has always built the
          # shipped tarballs with just this, so installing the webkit headers
          # here only made the README ask users for a package nothing needs.
          sudo apt-get install -y libgtk-4-dev

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      # Here as much as on macOS: `planAfterKeychain` is the one decision that
      # answers differently per platform, so a change that is right on macOS and
      # wrong on Linux has to fail here rather than at a reader's first launch.

      # The app ships ReleaseFast, and two things only exist there. The frame
      # budgets skip themselves in Debug, because a Debug rebuild is six times
      # slower and a budget loosened six times is no longer a frame; so the one
      # guard on the feed staying inside a frame has never actually run on any
      # machine but mine. And optimized builds have caught correctness bugs the
      # Debug build could not, so this is not only about the timings.
      - name: Test (ReleaseFast, the mode that ships)
        run: zig build test -Doptimize=ReleaseFast

      - name: Check formatting
        shell: bash
        run: zig fmt --check src

  # The suite that runs the app rather than its parts.
  #
  # Every unit test passed while v0.13.0 could not write to a relay at all, and
  # while the window was laid out 32 points taller than its own canvas. Neither
  # is visible to a test that never opens a window, and both were caught here.
  # It ran because I asked it to, which is not a check.
  #
  # Two of the four journeys, deliberately:
  #
  #   guest   a cold start fills a feed, creates no key, and the canvas is the
  #           size app.zon asks for.
  #   bundle  the real packaging path, with Notary's binaries injected and the
  #           signature verified, then launched.
  #
  # Not `frames`: it is a p90 against a budget, and a shared runner only ever
  # reads slow, so it would fail for reasons that are nothing to do with the
  # change under test. Not `follows`: it publishes signed events and needs a key.
  # Runs the Linux packaging script for real, on every push.
  #
  # `scripts/package-linux.sh` cannot be run on the machine it was written on: a
  # Mac has no Linux gtk4 to link against, so the build inside it dies before the
  # script gets anywhere near the parts worth checking. Untested packaging shell
  # is how a release goes out missing a helper, and this project has done that
  # once already, so the script runs here instead of being read and hoped over.
  #
  # It asserts what a working install needs by name (plaza, signer, notary), that
  # nothing else rode along, and that the desktop entry actually claims
  # `plaza://` links and carries a field code, which is the whole of how a link
  # reaches the app on Linux.
  linux-package:
    name: linux-package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    steps:
      - uses: actions/checkout@v4

      - name: Read Zig version
        id: zig-version
        run: echo "version=$(cat .zigversion)" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig-version.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Native SDK CLI
        run: npm install -g @native-sdk/cli@0.10.1

      # gtk4 only. Plaza draws on a canvas and declares no web use, so the host
      # compiles with the WebKitGTK stub and links gtk4 and libdl and nothing
      # else. Installing the WebKit development package here would hide a
      # regression that made it a real dependency.
      - name: Install the Linux host dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev

      # Read out of the RELEASE workflow rather than pinned again here. The
      # helpers are Notary's, and "whatever notary's main happened to be that
      # afternoon" is not something a package should be built against; a second
      # copy of the pin is just a second thing to forget when it moves. The
      # acceptance journey reads it the same way.
      - name: Read the pinned Notary ref
        id: notary-ref
        run: |
          ref="$(sed -n 's/^ *NOTARY_REF: *\(.*\)$/\1/p' .github/workflows/release.yml | head -1)"
          [ -n "$ref" ] || { echo "could not read NOTARY_REF from the release workflow"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out Notary
        uses: actions/checkout@v4
        with:
          repository: zig-nostr/notary
          ref: ${{ steps.notary-ref.outputs.ref }}
          path: .notary

      - name: Package
        run: scripts/package-linux.sh --notary .notary

      # The tarball is named by `uname -m`, so the two runners produce
      # different files and the artifact names have to differ too.
      - name: The tarball is for the architecture this runner actually is
        run: |
          got="$(ls dist/plaza-*-linux-*.tar.gz | head -1)"
          case "$got" in
            *-linux-${{ matrix.arch }}.tar.gz) echo "$got" ;;
            *) echo "expected a ${{ matrix.arch }} tarball, packaged $got" >&2; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: plaza-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  acceptance:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Zig version
        id: zig-version
        run: echo "version=$(cat .zigversion)" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig-version.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Native SDK CLI
        run: npm install -g @native-sdk/cli@0.10.1

      - name: A cold start, in a real window
        env:
          PLAZA_ACCEPTANCE_WORK: ${{ runner.temp }}/acceptance-guest
        run: bash scripts/acceptance.sh guest

      # Clones Notary at the tag the release workflow pins and packages against
      # it, so this is the bundle people download rather than one built against
      # whatever happened to be nearby.
      - name: The packaged bundle comes up
        env:
          PLAZA_ACCEPTANCE_WORK: ${{ runner.temp }}/acceptance-bundle
        run: bash scripts/acceptance.sh bundle

      # A red run whose logs are gone is a red run nobody can act on.
      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-logs
          path: |
            ${{ runner.temp }}/acceptance-guest/*.log
            ${{ runner.temp }}/acceptance-bundle/*.log
          if-no-files-found: ignore
