name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The full check on the platform Plaza ships from today.
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Zig version
        id: zig-version
        run: echo "version=$(cat .zigversion)" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig-version.outputs.version }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Native SDK CLI
        run: npm install -g @native-sdk/cli@0.9.2

      - name: Check markup and manifest
        run: native check

      - name: Test
        run: native test

      # The keyholder is a separate binary with its own step, so `native test`
      # and `zig build test` both walk straight past it. Its 21 tests had never
      # run on any machine but mine, including the ones guarding the migration
      # that can delete somebody's only copy of their key.

      - name: Build
        run: native build

      - name: Check formatting
        run: zig fmt --check src


  # Linux builds the whole stack (the library with its vendored secp256k1 and
  # LMDB, the stb codecs, and the app) and runs the test suite, so a portability
  # break surfaces on the pull request that causes it rather than months later.
  # A packaged Linux release comes later: the toolkit renders through a software
  # rasteriser off macOS today, so shipping one now would misrepresent how Plaza
  # performs.
  #
  # Windows is not in the matrix yet: the relay transport resolves hostnames
  # through libc `getaddrinfo`, which Zig's standard library does not declare
  # for Windows, so nothing depending on the library links there. That is a gap
  # in the protocol library rather than in Plaza, filed as zig-nostr/nostr#59
  # (found by this job on its first run), and Windows joins the matrix as soon
  # as it lands.
  # A release page's text is a hand-written file, and Notary shipped a release
  # describing the PREVIOUS one: the release commit bumped the versions and the
  # changelog and forgot this file, and nothing anywhere noticed. Whoever reads
  # that page is told about a release that is not the one they are downloading.
  #
  # Plaza publishes the same way and had the same hole. One grep on every push.
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The release notes name the version being released
        run: |
          version="$(sed -n 's/^ *\.version = "\(.*\)",$/\1/p' app.zon | head -1)"
          [ -n "$version" ] || { echo "could not read the version from app.zon"; exit 1; }
          if ! grep -qF "What's new in v$version" .github/RELEASE_NOTES.md; then
            echo "app.zon says $version, but .github/RELEASE_NOTES.md does not say"
            echo "\"What's new in v$version\". The release page takes its text from that"
            echo "file, so publishing now would describe a different release."
            echo
            echo "It currently says:"
            grep -n "What's new in" .github/RELEASE_NOTES.md || echo "  (nothing)"
            exit 1
          fi
          echo "release notes are for v$version"
  portability:
    name: portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Read Zig version
        id: zig-version
        shell: bash
        run: echo "version=$(cat .zigversion)" >> "$GITHUB_OUTPUT"

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.zig-version.outputs.version }}

      # The Linux host binds GTK4 and WebKitGTK; without the dev packages the
      # link fails on the host layer rather than on anything of ours.
      - name: Install Linux host dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Build
        run: zig build

      - name: Test
        run: zig build test

      # Here as much as on macOS: `planAfterKeychain` is the one decision that
      # answers differently per platform, so a change that is right on macOS and
      # wrong on Linux has to fail here rather than at a reader's first launch.

      # The app ships ReleaseFast, and two things only exist there. The frame
      # budgets skip themselves in Debug, because a Debug rebuild is six times
      # slower and a budget loosened six times is no longer a frame; so the one
      # guard on the feed staying inside a frame has never actually run on any
      # machine but mine. And optimized builds have caught correctness bugs the
      # Debug build could not, so this is not only about the timings.
      - name: Test (ReleaseFast, the mode that ships)
        run: zig build test -Doptimize=ReleaseFast

      - name: Check formatting
        shell: bash
        run: zig fmt --check src
